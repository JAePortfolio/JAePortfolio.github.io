        </div>

        <div class="form-control w-full">
          <label class="label pt-0"><span class="label-text font-bold uppercase text-xs opacity-50">Message</span></label>
          <textarea class="textarea textarea-bordered rounded-none w-full bg-base-100 h-24 resize-none" placeholder="How can I help you?"></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-block rounded-none h-16 text-lg font-black uppercase tracking-widest mt-2">
