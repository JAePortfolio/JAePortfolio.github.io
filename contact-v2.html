<!DOCTYPE html>
<html lang="en" data-theme="business">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John A - Computer Engineer</title>
    <link href="../../output.css" rel="stylesheet">
</head>

<body class="bg-base-100 text-base-content">
    <header id="main-navbar"></header>
<main class="max-w-6xl mx-auto px-6 py-24 min-h-[70vh]">
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-start">
    
    <div class="flex flex-col gap-8">
      <div>
        <h1 class="text-7xl font-black uppercase tracking-tighter mb-4">Get in touch</h1>
        <p class="text-lg opacity-70">Reach out via the form or my direct channels! Open for opportunities.</p>
      </div>

      <div class="flex flex-col gap-4">
                <div class="bg-base-200 border border-base-300 p-6 flex items-center gap-6">
                    <div class="text-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
                        </svg>
                    </div>
                    <div>
                        <span class="text-[10px] font-bold uppercase opacity-40 block">Email</span>
                        <a href="mailto:jarena012@gmail.com" class="font-bold text-lg hover:text-primary transition-colors">jarena012@gmail.com</a>
                    </div>
                </div>

                <div class="bg-base-200 border border-base-300 p-6 flex items-center gap-6">
                    <div class="text-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244" />
                        </svg>
                    </div>
                    <div>
                        <span class="text-[10px] font-bold uppercase opacity-40 block">LinkedIn</span>
                        <a href="https://www.linkedin.com/in/john-arena" class="font-bold text-lg hover:text-primary transition-colors">linkedin.com/in/john-arena</a>
                    </div>
                </div>

                <div class="bg-base-200 border border-base-300 p-6 flex items-center gap-6">
                    <div class="text-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.387a12.035 12.035 0 01-7.143-7.143c-.155-.441.011-.928.387-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z" />
                        </svg>
                    </div>
                    <div>
                        <span class="text-[10px] font-bold uppercase opacity-40 block">Phone</span>
                        <span class="font-bold text-lg">+1 (646)-804-8904</span>
                    </div>
                </div>
        </div>
    </div>

  <div class="bg-base-200 border border-base-300 p-8 flex flex-col h-full">
    <form id="contact-form" action="https://api.web3forms.com/submit" method="POST" class="flex flex-col h-full">
      
      <input type="hidden" name="access_key" value="b5c60a9a-7e27-470f-a3e4-a5682b8c8393">
      <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

      <div id="form-result" class="space-y-4 flex-grow">
        <div class="form-control">
          <label class="label"><span class="label-text font-bold uppercase text-[10px]">Name</span></label>
          <input type="text" name="name" required placeholder="Full Name" class="input input-bordered rounded-none bg-base-100 h-12 w-full" />
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text font-bold uppercase text-[10px]">Email</span></label>
          <input type="email" name="email" required placeholder="email@example.com" class="input input-bordered rounded-none bg-base-100 h-12 w-full" />
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text font-bold uppercase text-[10px]">Message</span></label>
          <textarea name="message" required class="textarea textarea-bordered rounded-none bg-base-100 h-28 resize-none w-full" placeholder="How can I help you?"></textarea>
        </div>
      </div>
      
      <div id="result" class="mt-4 text-center font-bold text-sm text-success hidden uppercase tracking-widest">
        Message Sent Successfully
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary btn-block rounded-none h-14 font-black uppercase mt-6">
        Send Message
      </button>
    </form>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initContactForm('contact-form');
        });
    </script>
  </div>

  </div>
</main>
    <footer id="main-footer"></footer>
    <div id="toast-container" class="toast toast-end toast-bottom z-100 p-6">
  </div>
</body>
</html>

<script src="../../js/components/layout.js"></script>
<script src="../../js/main.js"></script>
