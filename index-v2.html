<script>
const hero = document.getElementById('hero-slider');
const hardware = document.getElementById('hardware-bg');
const software = document.getElementById('software-bg');

hero.addEventListener('mousemove', e => {
  const rect = hero.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const totalWidth = rect.width;
  const totalOpacity = 100;

  // Mouse position as a percentage
  const percent = (mouseX / totalWidth) * 100;

  // Right panel width = mouse position percentage
  software.style.width = percent + "%";

  // Left panel width = remaining space
  hardware.style.width = (100 - percent) + "%";
  
  // Opacity adjusts based on mouse position. *2 because default will be 50% due to mouse starting in middle
  software.style.opacity = (totalOpacity - (100 - percent)) * 2 + "%";
  hardware.style.opacity = (totalOpacity - percent) * 2 + "%";
});

// Reset width to 50% and opacity to 100% when mouse leaves
hero.addEventListener('mouseleave', () => {
  hardware.style.width = "50%";
  software.style.width = "50%";
  hardware.style.opacity = "100%";
    software.style.opacity = "100%";
});
</script>
